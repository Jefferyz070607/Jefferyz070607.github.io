<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全屏图片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* 去掉滚动条 */
        }
        .full-img {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* 保持比例铺满屏幕 */
            display: block;
        }
    </style>
</head>
<body>
    <img src="kfc.jpg" class="full-img" alt="全屏背景">
</body>
</html>
